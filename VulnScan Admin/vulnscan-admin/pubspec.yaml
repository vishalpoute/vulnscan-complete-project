name: vulnscan_admin
description: VulnScan Admin Dashboard - Flutter Web
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Firebase
  firebase_core: ^25.0.0
  firebase_auth: ^4.20.0

  # State Management
  riverpod: ^2.6.0
  flutter_riverpod: ^2.6.0

  # HTTP Client
  dio: ^5.4.0

  # UI
  google_fonts: ^6.1.0
  
  # Charts
  fl_chart: ^0.65.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
